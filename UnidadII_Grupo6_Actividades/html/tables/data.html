<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado · Actividades · Grupo 6</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9; }
    .sidebar { width:250px; min-height:100vh; background:#343a40; color:#c2c7d0; position:fixed; }
    .sidebar a { color:#c2c7d0; text-decoration:none; display:block; padding:.7rem 1rem; border-radius:.3rem; }
    .sidebar a:hover,.sidebar a.active { background:#494e53; color:#fff; }
    .sidebar .brand { color:#fff; font-weight:600; padding:1rem; border-bottom:1px solid #4b545c; }
    .content { margin-left:250px; }
    @media (max-width:768px){ .sidebar{position:static;width:100%;min-height:auto} .content{margin-left:0} }
  </style>
</head>
<body>
  <nav class="sidebar p-2">
    <div class="brand"><i class="bi bi-people-fill"></i> CIAM · Grupo 6</div>
    <div class="mt-2">
      <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/listado" class="active"><i class="bi bi-table"></i> Listado de actividades</a>
      <a href="/crud"><i class="bi bi-pencil-square"></i> Mantenimiento</a>
    </div>
  </nav>

  <div class="content">
    <nav class="navbar navbar-light bg-white border-bottom px-4">
      <span class="navbar-brand mb-0 h5">Listado de actividades</span>
      <a href="/crud" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg"></i> Nueva actividad</a>
    </nav>

    <div class="container-fluid p-4">
      <!-- Tarjeta de filtros -->
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-funnel"></i> Filtros</div>
        <div class="card-body">
          <form id="f-filtros" class="row g-2">
            <div class="col-md-3">
              <label class="form-label">Estado</label>
              <select class="form-select" name="estado">
                <option value="">Todos</option>
                <option value="PROGRAMADA">PROGRAMADA</option>
                <option value="REALIZADA">REALIZADA</option>
                <option value="CANCELADA">CANCELADA</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Lugar</label>
              <select class="form-select" name="lugar"><option value="">Todos</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Responsable</label>
              <select class="form-select" name="responsable"><option value="">Todos</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Buscar</label>
              <input type="text" class="form-control" name="q" placeholder="nombre o descripcion">
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha desde</label>
              <input type="date" class="form-control" name="fecha_desde">
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha hasta</label>
              <input type="date" class="form-control" name="fecha_hasta">
            </div>
            <div class="col-md-6 d-flex align-items-end gap-2">
              <button class="btn btn-primary"><i class="bi bi-search"></i> Filtrar</button>
              <button type="button" id="btn-limpiar" class="btn btn-outline-secondary">Limpiar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>#</th><th>Nombre</th><th>Fecha</th><th>Horario</th>
                  <th>Lugar</th><th>Responsable</th><th>Cupo</th>
                  <th>Inscritos</th><th>Estado</th><th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbody"><tr><td colspan="10" class="text-center text-muted">Cargando...</td></tr></tbody>
            </table>
          </div>
          <p class="text-muted mb-0">Total: <span id="total">0</span> actividades</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = "/api/actividades";

    async function cargarCatalogos() {
      const r = await fetch(API + "/catalogos");
      const j = await r.json();
      if (!j.ok) return;
      const selP = document.querySelector('[name=responsable]');
      j.data.personal.forEach(p => selP.insertAdjacentHTML("beforeend", `<option value="${p.id_personal}">${p.nombre}</option>`));
      const selL = document.querySelector('[name=lugar]');
      j.data.lugares.forEach(l => selL.insertAdjacentHTML("beforeend", `<option value="${l}">${l}</option>`));
    }

    function badge(estado) {
      const map = { PROGRAMADA: "bg-primary", REALIZADA: "bg-success", CANCELADA: "bg-danger" };
      return `<span class="badge ${map[estado] || 'bg-secondary'}">${estado}</span>`;
    }

    async function cargar() {
      const f = document.getElementById("f-filtros");
      const p = new URLSearchParams();
      ["estado", "lugar", "responsable", "q", "fecha_desde", "fecha_hasta"].forEach(n => {
        if (f[n].value) p.set(n, f[n].value);
      });
      const r = await fetch(API + "?" + p.toString());
      const j = await r.json();
      const tb = document.getElementById("tbody");
      if (!j.ok) { tb.innerHTML = `<tr><td colspan="10" class="text-danger text-center">${j.error}</td></tr>`; return; }
      document.getElementById("total").textContent = j.total;
      if (j.total === 0) { tb.innerHTML = `<tr><td colspan="10" class="text-center text-muted">Sin resultados</td></tr>`; return; }
      tb.innerHTML = j.data.map(a => `
        <tr>
          <td>${a.id_actividad}</td>
          <td>${a.nombre}</td>
          <td>${a.fecha}</td>
          <td>${a.hora_inicio.slice(0,5)} - ${a.hora_fin.slice(0,5)}</td>
          <td>${a.lugar}</td>
          <td>${a.responsable || '<span class="text-muted">—</span>'}</td>
          <td>${a.cupo}</td>
          <td>${a.inscritos}</td>
          <td>${badge(a.estado)}</td>
          <td class="text-end">
            <a href="/crud?id=${a.id_actividad}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
            <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${a.id_actividad}, ${a.inscritos})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join("");
    }

    async function eliminar(id, inscritos) {
      let msg = "¿Eliminar la actividad #" + id + "?";
      if (inscritos > 0) msg += `\nSe perderan ${inscritos} participacion(es) asociadas.`;
      if (!confirm(msg)) return;
      const r = await fetch(API + "/" + id, { method: "DELETE" });
      const j = await r.json();
      if (j.ok) cargar(); else alert("Error: " + j.error);
    }

    document.getElementById("f-filtros").addEventListener("submit", e => { e.preventDefault(); cargar(); });
    document.getElementById("btn-limpiar").addEventListener("click", () => { document.getElementById("f-filtros").reset(); cargar(); });

    cargarCatalogos(); cargar();
  </script>
</body>
</html>
