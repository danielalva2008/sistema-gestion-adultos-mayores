<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incidentes | Listado de incidentes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/adminlte.css" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Mostrar u ocultar menú"><i class="bi bi-list"></i></a>
        </li>
        <li class="nav-item d-none d-md-block"><span class="nav-link fw-semibold">Residencia de adultos mayores · Módulo de incidentes</span></li>
      </ul>
    </div>
  </nav>

  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand">
      <a href="/index.html" class="brand-link"><span class="brand-text fw-light"><i class="bi bi-shield-plus me-1"></i> Grupo 4 · Incidentes</span></a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" role="menu">
<li class="nav-item"><a href="/index.html" class="nav-link"><i class="nav-icon bi bi-speedometer2"></i><p>Dashboard</p></a></li>
<li class="nav-item"><a href="/listado.html" class="nav-link active"><i class="nav-icon bi bi-table"></i><p>Listado</p></a></li>
<li class="nav-item"><a href="/crud.html" class="nav-link"><i class="nav-icon bi bi-pencil-square"></i><p>Mantenimiento</p></a></li>
<li class="nav-item"><a href="/index.html#transferencia" class="nav-link"><i class="nav-icon bi bi-cloud-arrow-up"></i><p>Transferencia</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <div class="row"><div class="col-sm-6"><h3 class="mb-0">Listado de incidentes</h3></div></div>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div id="avisos"></div>

        <div class="card mb-3">
          <div class="card-header"><h3 class="card-title">Filtros</h3></div>
          <div class="card-body">
            <form id="form-filtros" class="row g-2">
              <div class="col-md-4"><label class="form-label" for="q">Buscar (lugar o residente)</label><input type="text" class="form-control" id="q"></div>
              <div class="col-md-4"><label class="form-label" for="tipo">Tipo de incidente</label><select class="form-select" id="tipo"><option value="">Todos</option></select></div>
              <div class="col-md-4"><label class="form-label" for="estado">Estado</label>
                <select class="form-select" id="estado"><option value="">Todos</option><option value="REGISTRADO">Registrado</option><option value="EN_SEGUIMIENTO">En seguimiento</option><option value="CERRADO">Cerrado</option></select></div>
              <div class="col-md-3"><label class="form-label" for="nivel_riesgo">Nivel de riesgo</label>
                <select class="form-select" id="nivel_riesgo"><option value="">Todos</option><option value="BAJO">Bajo</option><option value="MEDIO">Medio</option><option value="ALTO">Alto</option><option value="CRITICO">Crítico</option></select></div>
              <div class="col-md-3"><label class="form-label" for="seguimiento">Requiere seguimiento</label>
                <select class="form-select" id="seguimiento"><option value="">Todos</option><option value="1">Sí</option><option value="0">No</option></select></div>
              <div class="col-md-3"><label class="form-label" for="fecha_desde">Desde</label><input type="date" class="form-control" id="fecha_desde"></div>
              <div class="col-md-3"><label class="form-label" for="fecha_hasta">Hasta</label><input type="date" class="form-control" id="fecha_hasta"></div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
                <button type="button" class="btn btn-outline-secondary" id="btn-limpiar">Limpiar</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Incidentes</h3><div class="card-tools"><span class="badge text-bg-secondary" id="total">0</span></div></div>
          <div class="card-body table-responsive p-0">
            <table class="table table-striped table-hover mb-0">
              <thead><tr><th>ID</th><th>Fecha</th><th>Residente</th><th>Tipo</th><th>Riesgo</th><th>Lugar</th><th>Estado</th><th>Seguimiento</th><th></th></tr></thead>
              <tbody id="tabla"><tr><td colspan="9" class="text-center text-secondary py-4">Cargando…</td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer"><strong>Plataformas · Unidad II</strong> — MySQL → SQL Server</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es6.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
<script src="/static/js/adminlte.js"></script>
<script src="/static/js/incidentes.js"></script>
<script src="/static/js/listado.js"></script>
</body>
</html>
